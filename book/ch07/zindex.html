<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 100px;
            height:100px;
            background-color: #ace;
            border: 3px solid #bed;
            margin-left: 30px;
            margin-top: 20px;
        }
        #box2{
            position:relative;
            left:30px;
            top:-50px;
            z-index: 10;
        }
        #box3{
            position:relative;
            left:60px;
            top:-100px;
            z-index: 20;
        }

    </style>
</head>
<body>
    <div class="box" id="box1"></div>
    <div class="box" id="box2"></div>
    <div class="box" id="box3"></div>
</body>
</html>
