<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>둥근 사각형</title>
    <style>
        .rounded-square {
            position: relative;
            width: 400px;
            height: 200px;
            border: 5px solid #3498db;
            border-radius: 20px;
            background-color: transparent;
            overflow: hidden;

            display:flex;
            justify-content:center;
            align-items: center;
        }

        .text{
            font-size: 50px;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            border-width: 0 0 9px;
            border-style: double;
            border-color: #333

        }

    </style>
</head>
<body>
    <div class="rounded-square" draggable="true">
        <div class="text">SUM</div>
    </div>
</body>
</html>
