<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{
            padding: 20px;
            border: 1px solid #cccccc;
            margin: 20px;
        }

        .shadow1{
            box-shadow: 5px 5px 10px #00000066;
        }
        .shadow2{
            box-shadow: 5px -5px 10px #000000AA;
        }
    </style>
</head>
<body>
    <img src="../img/google.jpg" alt="" class="shadow1">
    <img src="../img/html5.jpg" alt="" class="shadow2">
</body>
</html>
