<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <style>
        div{
            width:200px;
            height:50px;
            padding:10px;
            margin:30px;
        }

        #sb1{
            border: 1px solid rgb(0,128,128,0.2);
            box-shadow: 0 0 20px -3px rgba(0,128,128,0.4) inset;
            z-index: -3;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #sb2{
            border: 1px solid black;
            box-shadow:
                0 0 0  4px #808000 inset,
                0 0 0  8px #A0A000 inset,
                0 0 0 12px #D0D000 inset;
            padding:19px;
        }
    </style>

</head>
<body>
    <div id="sb1">
        <h3>Box Shaddow</h3>
    </div>
    <div id="sb2">
        <h4>Boxx Shadow</h4>
    </div>
</body>
</html>
