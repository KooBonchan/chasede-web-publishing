<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin : 0 auto;
            padding: 0;
        }
        body{
            font-family: sans-serif;
            font-weight: bold;
            font-size: 20px;
        }

        .wrapper{
            display: flex;
            min-width: 300px;
            width: 50%;
            min-height:400px;
            height: 30vh;
            flex-wrap: wrap;
            justify-content: space-around;
            background-color: #eee;
            padding : 10px;
        }
        .box{
            margin:1px;
            width: 80px;
            background-color: #fff;
        }

        #box1{
            border: 6px dotted greenyellow;
        }
        #box2{
            border-style: solid;
            border-width: 1px 3px 5px 3px;
            border-color: #000 #333 #666 #999
        }
        #box3{
            border-width: 5px 0px;
            border-style: dashed double;
            border-color: #44556677;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="box" id="box1">Box1</div>
        <div class="box" id="box2">Box2</div>
        <div class="box" id="box3">Box3</div>
    </div>
    
</body>
</html>
